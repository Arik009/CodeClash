<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeClash: live coding and quiz contests" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><text x='5' y='22' font-family='monospace' font-size='16' font-weight='700' fill='white'>&gt;_</text></svg>" />
    <title>CodeClash</title>
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('cc.theme.vars') || 'null');
        if (saved) {
          var root = document.documentElement;
          for (var name in saved.vars) root.style.setProperty(name, saved.vars[name]);
          root.dataset.theme = saved.id;
          root.style.colorScheme = saved.dark ? 'dark' : 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
